[project]
name = "flnr"
version = "0.3.0"
description = "Zero-dependency process runner with explicit lifecycle control and stream multiplexing."
readme = "readme.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/EccoTheDolphin/flnr/"
Documentation = "https://flnr.readthedocs.io/en/stable/"
Repository = "https://github.com/EccoTheDolphin/flnr/"
Issues = "https://github.com/EccoTheDolphin/flnr/issues/"
Changelog = "https://github.com/EccoTheDolphin/flnr/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  # pytest.
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "pytest-profiling>=1.8.1",
  "pytest-resource-usage>=1.0.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "pytest>=8.2.1",
  # Linters.
  "mdformat-config>=0.2.1",
  "mdformat-ruff>=0.1.3",
  "mdformat-shfmt>=0.2.0",
  "mdformat-tables>=1.0.0",
  "mdformat-toc>=0.3.0",
  "mdformat-web>=0.2.0",
  "mdformat>=0.7.22",
  "mypy>=1.11.1",
  "ruff>=0.15.2",
  "typos>=1.44.0",
  "yamllint>=1.35.1",
  # dev env
  "typer>=0.16.0", # Primary CLI engine.
  "click>=8.1.7", # Used for some typer tweaking.
  "rich>=14.0.0",
  "sphinx>=8.1.3,<9",
  "sphinx-rtd-theme>=3.1.0",
  "sphinx-autodoc-typehints>=2.0.0",
  # furry
  "furo>=2025.12.19",
]
mutation = [
    "mutmut==3.5.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flnr"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "readme.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = [
  "-n=5",
  "--tb=short",
  "--durations=50",
  "--cov=src/",
  "--cov-fail-under=90",
  "--cov-report=html",
  "--cov-report=term",
]
markers = [
  "slow: marks tests as slow",
  "stress: test targeting large amounts of data and memory consumption",
  "extra: marks tests that check for an extended set of situations",
]

[tool.coverage.run]
parallel = true
patch = ["subprocess"]
data_file = "build/coverage/.coverage"
branch = true

[tool.coverage.report]
precision = 2

[tool.ruff]
line-length = 80
exclude = ["docs", "mutants"]

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  # using assert to guide linter checks is perfectly fine.
  "S101",
  # warning: `one-blank-line-before-class` (D203) and
  #          `no-blank-line-before-class`  (D211) are incompatible.
  #          Ignoring `one-blank-line-before-class`.
  "D203",
  # warning: `multi-line-summary-first-line`  (D212) and
  #          `multi-line-summary-second-line` (D213) are incompatible.
  #          Ignoring `multi-line-summary-second-line`.
  "D213",
  # "Logging statement uses +"
  # "Logging statement uses f-string"
  # I personally don't find performance concerns reasonable enough.
  "G003",
  "G004",


  # warning: The following rules may cause conflicts when used with the formatter: `COM812`, `ISC001`.
  # COM812: Checks for the absence of trailing commas.
  # ISC001: Checks for implicitly concatenated strings on a single line.
  "COM812",
  "ISC001",

  # "Import alias does not rename original package."
  # This is used to reexport symbols.
  "PLC0414",
  # I know that large number of arguments is not good and I don't need linter
  # to remind me.
  "PLR0913",
  # Ruff prefers Self over returning the class name as a string literal.
  # We intentionally keep the string literal to avoid a runtime dependency
  # on typing_extensions on Python 3.10.
  "PYI034",
]

[tool.ruff.lint.per-file-ignores]
"src/flnr/mu.py" = [
  "ARG002", # monitor methods keep descriptive parameter names for API docs.
]
"{tests,attic}/**/*.py" = [
  "S101",   # Allow asserts.
  "S311", # we no crypto in our hood
  "INP001", # Suppress `__init__.py` warning in tests.
  # "Missing docstring"
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D107",
  "T201", # Allow print in tests
  "FBT001", # Allow bool in tests
  "S603", # allow subprocess.run
]

[tool.typos]
# See https://github.com/crate-ci/typos/blob/master/docs/reference.md#example-configurations
default.extend-ignore-re = [
  "(?Rm)^.*(#|//|<!--)\\s*typos:\\s*ignore$",
  "(?s)(#|//|<!--)\\s*typos:\\s*off.*?(#|//|<!--)\\s*typos:\\s*on",
]
default.extend-ignore-identifiers-re = [
  "Raison",
  "raison",
  "borken",
]
files.extend-exclude = ["*.sops.yaml"]

[tool.mypy]
strict = true
exclude = [
  '^result/', # Default `nix` output.
  '^docs/', # don't scan sphinx configs
  '^mutants/', # don't scan mutmut files
]

[tool.black] # The tool is not used in a project, this is only for IDE.
line-length = 80

[tool.isort] # The tool is not used in a project, this is only for IDE.
profile = "black"
line_length = 80
skip_gitignore = true


[tool.mutmut]
paths_to_mutate = ["src/flnr"]
do_not_mutate = [
    # mutating of enum breaks python runtime
    "src/flnr/monitor_failure.py",
]
pytest_add_cli_args_test_selection = [
  "-m",
  "not slow and not stress",
]
pytest_add_cli_args = [
  "-n", "0",
  "--no-cov",
  "--timeout=300",
  "--timeout-method=thread",
]
