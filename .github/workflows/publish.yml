name: publish

on:
  push:
    tags:
      - "v*"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  publish-pypi:
    name: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/flnr
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Check tag matches project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "release tag does not match project version"
            echo "tag version:     $tag_version"
            echo "project version: $project_version"
            exit 1
          fi

      - name: Check formatting
        run: uv run --frozen ./attic/repo.py format --check

      - name: Lint
        run: uv run --frozen ./attic/repo.py lint

      - name: Test
        run: uv run --frozen pytest -m "not slow" --no-cov

      - name: Build distributions
        run: uv build --no-sources

      - name: Inspect distributions
        run: |
          ls -la dist
          python -m zipfile -l dist/*.whl
          tar -tzf dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
